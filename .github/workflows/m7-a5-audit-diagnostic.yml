name: M7 A5 unpaid Audit diagnostic
run-name: M7 A5 unpaid Audit diagnostic
on:
  workflow_dispatch:
    inputs:
      approved_workflow_sha:
        required: true
permissions: {}
concurrency:
  group: m7-a5-observation-20261022
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository_id == '1361354906' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Exact reviewed source and target quality
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: 77d89ca8c4281cc46f77dcead9b4dfee5a54bd55
          A5_TARGET_SHA: 0ea0b71381ad78b8fe1f371441fe546171671ce1
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
        run: node control/.m7-a5/verify-source.mjs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: SolusQuest/contract-scribe
          ref: 77d89ca8c4281cc46f77dcead9b4dfee5a54bd55
          path: product
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0ea0b71381ad78b8fe1f371441fe546171671ce1
          path: target
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: product/global.json
      - name: Acquire exact reviewed current CI payload
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: 77d89ca8c4281cc46f77dcead9b4dfee5a54bd55
          A5_PRODUCT_ROOT: ${{ github.workspace }}/product
        run: python3 control/.m7-a5/acquire-payload.py
      - name: Restore and build synthetic project without credentials
        run: |
          set -euo pipefail
          dotnet restore target/App/App.csproj --configfile control/.m7-a5/synthetic-nuget.config
          dotnet build target/App/App.csproj -c Debug --no-restore
      - name: Original project then cwd then solution comparison
        id: audit
        env:
          A5_CLI: ${{ env.A5_ACQUIRED_CLI }}
          A5_TARGET_ROOT: ${{ github.workspace }}/target
          A5_PRODUCT_SHA: 77d89ca8c4281cc46f77dcead9b4dfee5a54bd55
          A5_TARGET_SHA: 0ea0b71381ad78b8fe1f371441fe546171671ce1
        run: python3 control/.m7-a5/audit-preflight.py diagnostic
      - name: Seal bounded closed diagnostic batch
        if: always() && steps.audit.outcome == 'success'
        env:
          A5_RECIPIENT_PUBLIC_KEY: ${{ github.workspace }}/control/.m7-a5/recipient-public.pem
        run: bash control/.m7-a5/private-result-collection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.audit.outcome == 'success'
        with:
          name: m7-a5-unpaid-audit-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a5-private.jwe
          if-no-files-found: error
          retention-days: 1
      - name: Preserve actual Audit batch failure
        if: always() && steps.audit.outcome == 'success'
        run: test "$(cat "$RUNNER_TEMP/a5-exit-code.txt")" = 0
