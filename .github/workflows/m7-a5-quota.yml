name: M7 A5 GitHub quota readback
on: workflow_dispatch
permissions: {}
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read only current Actions credential rate counters
        run: |
          set -euo pipefail
          gh api rate_limit --jq '{core: .resources.core, graphql: .resources.graphql}'
          set +e
          gh api --include repos/SolusQuest/contract-scribe-sandbox > "$RUNNER_TEMP/quota-response.txt" 2> "$RUNNER_TEMP/quota-stderr.txt"
          result=$?
          set -e
          python3 - "$RUNNER_TEMP/quota-response.txt" "$result" <<'PY'
          import json,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_text();headers,_,body=raw.partition('\n\n');selected=[line for line in headers.splitlines()if line.lower().startswith(('http/','x-ratelimit-','retry-after:','date:'))];print(json.dumps({'actualExit':int(sys.argv[2]),'headers':selected}))
          PY
