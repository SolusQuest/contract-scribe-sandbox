# Temporary trigger-only diagnostic for ContractScribe #204/#188.
# No checkout, external action, secret, artifact, provider or product invocation.
name: M6 schedule delivery diagnostic
run-name: M6 trigger diagnostic - ${{ github.event_name }}

on:
  workflow_dispatch: {}
  schedule:
    - cron: '2-57/5 * * * *'

permissions: {}

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record native trigger identity
        env:
          OBSERVED_EVENT: ${{ github.event_name }}
          OBSERVED_CRON: ${{ github.event.schedule || '' }}
          OBSERVED_SHA: ${{ github.sha }}
          OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          OBSERVED_RUN_ID: ${{ github.run_id }}
          OBSERVED_RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVED_RUN_NUMBER: ${{ github.run_number }}
          OBSERVED_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          record = {name: value for name, value in os.environ.items() if name.startswith('OBSERVED_')}
          record['observed_at_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          print(json.dumps(record, sort_keys=True))
          PY
