name: M7 A5 bounded observation
run-name: M7 A5 slot ${{ inputs.slot }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        default: 462bf240914f89f596d622028e8fc4b8ce39e0f1
      approved_workflow_sha:
        required: true
      product_sha:
        required: true
        default: 8675685f067adf7bf6c7adc373ea8fdbd09bf6a1
      slot:
        required: true
        type: choice
        options: ['32']
permissions: {}
concurrency:
  group: m7-a5-observation-20261022
  cancel-in-progress: false
jobs:
  observe:
    # Local installation candidate only; remote installation/dispatch needs approval.
    if: github.repository_id == '1361354906' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      A5_PHASE: q2
      A5_SLOT: ${{ inputs.slot }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Verify exact reviewed source and terminal quality before build
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
        run: node control/.m7-a5/verify-source.mjs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: SolusQuest/contract-scribe
          ref: ${{ inputs.product_sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Acquire reviewed exact current-CI payload before provider injection
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_PRODUCT_ROOT: ${{ github.workspace }}/product
        run: python3 control/.m7-a5/acquire-payload.py
      - name: Restore synthetic target without credentials and select bounded profile
        run: |
          set -euo pipefail
          test -z "${CONTRACTSCRIBE_PROVIDER_API_KEY:-}${GH_TOKEN:-}${GITHUB_TOKEN:-}${CONTRACTSCRIBE_GITHUB_TOKEN:-}"
          dotnet restore target/App/App.csproj --configfile control/.m7-a5/synthetic-nuget.config
          dotnet build target/App/App.csproj -c Debug --no-restore
          umask 077
          cp control/.m7-a5/campaign.json "$RUNNER_TEMP/campaign.json"
          node control/.m7-a5/select-profile.mjs copy "$SLOT" "$RUNNER_TEMP/consumer.json"
        env:
          SLOT: ${{ inputs.slot }}
      - name: Complete real Audit before provider injection or budget claim
        id: audit
        env:
          A5_CLI: ${{ env.A5_ACQUIRED_CLI }}
          A5_TARGET_ROOT: ${{ github.workspace }}/target
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
        run: python3 control/.m7-a5/audit-preflight.py preflight
      - name: Observe starting Actions quota before this invocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess
          r=subprocess.run(['gh','api','--include','repos/SolusQuest/contract-scribe-sandbox'],capture_output=True,text=True)
          headers=r.stdout.partition('\n\n')[0]
          print(json.dumps({'originalRunId':os.environ['GITHUB_RUN_ID'],'quotaReadExit':r.returncode,'position':'before','headers':[line for line in headers.splitlines() if line.lower().startswith(('http/','x-ratelimit-','retry-after:','date:'))]}))
          PYTHON
      - name: Atomic original prospective funding32 claim after own complete real Audit
        if: steps.audit.outcome == 'success'
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_SLOT: ${{ inputs.slot }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_ROOT: ${{ github.workspace }}/target
          A5_CLI: ${{ env.A5_ACQUIRED_CLI }}
          A5_CAMPAIGN: ${{ runner.temp }}/campaign.json
          A5_CONSUMER: ${{ runner.temp }}/consumer.json
        run: bash control/.m7-a5/budget-and-launch.sh claim
      - name: Single bounded production invocation
        if: steps.budget.outcome == 'success'
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTSCRIBE_GITHUB_TOKEN: ${{ github.token }}
          CONTRACTSCRIBE_PROVIDER_API_KEY: ${{ secrets.M7_A5_DEEPSEEK_KEY }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_SLOT: ${{ inputs.slot }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_ROOT: ${{ github.workspace }}/target
          A5_CLI: ${{ env.A5_ACQUIRED_CLI }}
          A5_CAMPAIGN: ${{ runner.temp }}/campaign.json
          A5_CONSUMER: ${{ runner.temp }}/consumer.json
        run: bash control/.m7-a5/budget-and-launch.sh launch
      - name: Observe actual Actions quota after this invocation
        if: always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess
          r=subprocess.run(['gh','api','--include','repos/SolusQuest/contract-scribe-sandbox'],capture_output=True,text=True)
          headers=r.stdout.partition('\n\n')[0]
          print(json.dumps({'originalRunId':os.environ['GITHUB_RUN_ID'],'quotaReadExit':r.returncode,'headers':[line for line in headers.splitlines() if line.lower().startswith(('http/','x-ratelimit-','retry-after:','date:'))]}))
          PYTHON
      - name: Seal bounded result
        if: always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.budget.outcome == 'failure')
        env:
          A5_RECIPIENT_PUBLIC_KEY: ${{ github.workspace }}/control/.m7-a5/recipient-public.pem
        run: bash control/.m7-a5/private-result-collection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.budget.outcome == 'failure')
        with:
          name: m7-a5-sealed-slot-${{ inputs.slot }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a5-private.jwe
          if-no-files-found: error
          retention-days: 1
      - name: Preserve actual CLI failure
        if: always() && (steps.live.outcome == 'success' || steps.live.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.budget.outcome == 'failure')
        run: test "$(cat "$RUNNER_TEMP/a5-exit-code.txt")" = 0
