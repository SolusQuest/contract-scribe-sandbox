name: M7 A5 bounded observation
run-name: M7 A5 lifecycle ${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        default: 0ea0b71381ad78b8fe1f371441fe546171671ce1
      approved_workflow_sha:
        required: true
      product_sha:
        required: true
        default: 4ca77d69cbaf2d3cb18c49352a43f4449c9da991
      phase:
        required: true
        type: choice
        options: ['open-wait', 'closed-samebase', 'closed-config']
permissions: {}
concurrency:
  group: m7-a5-observation-20261022
  cancel-in-progress: false
jobs:
  observe:
    # Local installation candidate only; remote installation/dispatch needs approval.
    if: github.repository_id == '1361354906' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      A5_PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Verify exact reviewed source and terminal quality before build
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
        run: node control/.m7-a5/verify-source.mjs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: SolusQuest/contract-scribe
          ref: ${{ inputs.product_sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Acquire reviewed exact current-CI payload before provider injection
        env:
          GH_TOKEN: ${{ github.token }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_PRODUCT_ROOT: ${{ github.workspace }}/product
        run: python3 control/.m7-a5/acquire-payload.py
      - name: Prepare synthetic target without credentials and select zero-provider profile
        run: |
          set -euo pipefail
          test -z "${CONTRACTSCRIBE_PROVIDER_API_KEY:-}${GH_TOKEN:-}${GITHUB_TOKEN:-}${CONTRACTSCRIBE_GITHUB_TOKEN:-}"
          dotnet restore target/App/App.csproj --configfile control/.m7-a5/synthetic-nuget.config
          dotnet build target/App/App.csproj -c Debug --no-restore
          umask 077
          cp control/.m7-a5/campaign.json "$RUNNER_TEMP/campaign.json"
          node control/.m7-a5/select-profile.mjs copy "$A5_PHASE" "$RUNNER_TEMP/consumer.json"
      - name: Single expected lifecycle preflight with provider secret withheld
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACTSCRIBE_GITHUB_TOKEN: ${{ github.token }}
          A5_APPROVED_WORKFLOW_SHA: ${{ inputs.approved_workflow_sha }}
          A5_TARGET_SHA: ${{ inputs.target_sha }}
          A5_PRODUCT_SHA: ${{ inputs.product_sha }}
          A5_TARGET_ROOT: ${{ github.workspace }}/target
          A5_CLI: ${{ env.A5_ACQUIRED_CLI }}
          A5_CAMPAIGN: ${{ runner.temp }}/campaign.json
          A5_CONSUMER: ${{ runner.temp }}/consumer.json
        run: bash control/.m7-a5/budget-and-launch.sh gate
      - name: Seal bounded result
        if: always() && steps.live.outputs.started == 'true'
        env:
          A5_RECIPIENT_PUBLIC_KEY: ${{ github.workspace }}/control/.m7-a5/recipient-public.pem
        run: bash control/.m7-a5/private-result-collection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.live.outputs.started == 'true'
        with:
          name: m7-a5-lifecycle-${{ inputs.phase }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a5-private.jwe
          if-no-files-found: error
          retention-days: 1
      # Raw CLI exit4 for the expected closed gate remains in the sealed result.
      # Workflow success only means that the named expected zero-provider gate matched.
